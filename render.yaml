# render.yaml
services:
  - type: web
    name: stock-analyzer
    runtime: python
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME  # Replace with your repo
    plan: free
    region: singapore  # Choose: oregon (US), frankfurt (EU), singapore (Asia)
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: SECRET_KEY
        generateValue: true  # Generates a random secret key